[package]
name = "zz-geo-desktop"
version = "0.2.0"
description = "ZZ Geo desktop client"
authors = ["ZZ Geo"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.8.2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
