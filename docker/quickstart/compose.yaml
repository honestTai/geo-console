name: zzgeo-quickstart
x-environment: &environment
  NODE_ENV: production
  DATABASE_URL: postgresql://geo@postgres:5432/geo
  PGPASSWORD_FILE: /run/secrets/postgres_password
  GEO_MASTER_KEY_FILE: /run/secrets/master_key
  GEO_DATA_DIR: /data
  GEO_LOG_SERVICE_URL: http://log-service:3020
  GEO_LOG_SERVICE_TOKEN_FILE: /run/secrets/log_service_token
x-runtime: &runtime
  image: zzgeo-quickstart-runtime:local
  build:
    context: ../..
    dockerfile: docker/quickstart/Dockerfile
    target: runtime
    args:
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
  restart: unless-stopped
  environment: *environment
  secrets: [postgres_password, master_key, log_service_token]
  volumes: [evidence:/data]
  depends_on:
    postgres: {condition: service_healthy}
services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U geo -d geo]
      interval: 5s
      timeout: 5s
      retries: 30
  log-service:
    <<: *runtime
    environment:
      <<: *environment
      GEO_LOG_SERVICE_HOST: 0.0.0.0
      GEO_LOG_SERVICE_PORT: 3020
    command: [/opt/geo-app/apps/log-service/node_modules/.bin/tsx, /opt/geo-app/apps/log-service/src/index.ts]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3020/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    <<: *runtime
    environment:
      <<: *environment
      GEO_WORKER_HOST: 0.0.0.0
      GEO_WORKER_PORT: 3010
      GEO_TRUST_PROXY: "true"
      GEO_ALLOWED_ORIGIN: ${GEO_ORIGIN:?Generated by start script}
      GEO_ADMIN_EMAIL: ${GEO_ADMIN_EMAIL:?Set admin email}
      GEO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [postgres_password, master_key, log_service_token, admin_password]
    depends_on:
      postgres: {condition: service_healthy}
      log-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
  capture-worker:
    <<: *runtime
    command: [/opt/geo-app/apps/worker/node_modules/.bin/tsx, /opt/geo-app/apps/worker/src/capture-worker.ts]
  agent-worker:
    <<: *runtime
    command: [/opt/geo-app/apps/worker/node_modules/.bin/tsx, /opt/geo-app/apps/worker/src/agent-worker.ts]
  semantic-worker:
    <<: *runtime
    command: [/opt/geo-app/apps/worker/node_modules/.bin/tsx, /opt/geo-app/apps/worker/src/semantic-worker.ts]
  report-worker:
    <<: *runtime
    command: [/opt/geo-app/apps/worker/node_modules/.bin/tsx, /opt/geo-app/apps/worker/src/report-worker.ts]
  web:
    image: zzgeo-quickstart-web:local
    build:
      context: ../..
      dockerfile: docker/quickstart/Dockerfile
      target: web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      GEO_SITE_ADDRESS: ${GEO_SITE_ADDRESS:?Generated by start script}
    ports:
      - ${GEO_BIND:-127.0.0.1}:${GEO_HTTP_PORT:-8080}:80
      - ${GEO_BIND:-127.0.0.1}:${GEO_HTTPS_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
secrets:
  postgres_password: {file: ../../.quickstart/secrets/postgres_password}
  master_key: {file: ../../.quickstart/secrets/master_key}
  log_service_token: {file: ../../.quickstart/secrets/log_service_token}
  admin_password: {file: ../../.quickstart/secrets/admin_password}
volumes:
  database:
  evidence:
  caddy_data:
  caddy_config:
