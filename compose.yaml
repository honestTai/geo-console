name: geo-console

x-worker-environment: &worker-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://geo@postgres:5432/geo
  PGPASSWORD_FILE: /run/secrets/postgres_password
  GEO_MASTER_KEY_FILE: /run/secrets/master_key
  GEO_DATA_DIR: /data
  GEO_OBJECT_STORE: ${GEO_OBJECT_STORE:-local}
  GEO_S3_ENDPOINT: ${GEO_S3_ENDPOINT:-}
  GEO_S3_REGION: ${GEO_S3_REGION:-auto}
  GEO_S3_BUCKET: ${GEO_S3_BUCKET:-}
  GEO_S3_ACCESS_KEY_ID: ${GEO_S3_ACCESS_KEY_ID:-}
  GEO_S3_SECRET_ACCESS_KEY: ${GEO_S3_SECRET_ACCESS_KEY:-}
  GEO_S3_FORCE_PATH_STYLE: ${GEO_S3_FORCE_PATH_STYLE:-false}
  GEO_LOG_SERVICE_URL: http://log-service:3020
  GEO_LOG_SERVICE_TOKEN_FILE: /run/secrets/log_service_token

x-worker-base: &worker-base
  image: geo-console-worker:${GEO_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: worker
    args:
      GEO_WORKER_BASE_IMAGE: ${GEO_WORKER_BASE_IMAGE:?set GEO_WORKER_BASE_IMAGE}
  environment: *worker-environment
  secrets:
    - postgres_password
    - master_key
    - log_service_token
  volumes:
    - evidence_data:/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  log-service:
    image: geo-console-worker:${GEO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args:
        GEO_WORKER_BASE_IMAGE: ${GEO_WORKER_BASE_IMAGE:?set GEO_WORKER_BASE_IMAGE}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://geo@postgres:5432/geo
      PGPASSWORD_FILE: /run/secrets/postgres_password
      GEO_LOG_SERVICE_HOST: 0.0.0.0
      GEO_LOG_SERVICE_PORT: 3020
      GEO_LOG_SERVICE_TOKEN_FILE: /run/secrets/log_service_token
      GEO_LOG_RETENTION_DAYS: ${GEO_LOG_RETENTION_DAYS:-90}
    secrets:
      - postgres_password
      - log_service_token
    command: ["/opt/geo-app/apps/log-service/node_modules/.bin/tsx", "/opt/geo-app/apps/log-service/src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *worker-base
    environment:
      <<: *worker-environment
      GEO_WORKER_HOST: 0.0.0.0
      GEO_WORKER_PORT: 3010
      GEO_ALLOWED_ORIGIN: https://${GEO_DOMAIN:?set GEO_DOMAIN}
      GEO_ADMIN_EMAIL: ${GEO_ADMIN_EMAIL:-admin@geo.local}
      GEO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - postgres_password
      - master_key
      - admin_password
      - log_service_token
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      log-service:
        condition: service_healthy

  capture-worker:
    <<: *worker-base
    environment:
      <<: *worker-environment
      GEO_CAPTURE_CONCURRENCY: ${GEO_CAPTURE_CONCURRENCY:-2}
    command: ["/opt/geo-app/apps/worker/node_modules/.bin/tsx", "/opt/geo-app/apps/worker/src/capture-worker.ts"]

  agent-worker:
    <<: *worker-base
    command: ["/opt/geo-app/apps/worker/node_modules/.bin/tsx", "/opt/geo-app/apps/worker/src/agent-worker.ts"]

  report-worker:
    <<: *worker-base
    command: ["/opt/geo-app/apps/worker/node_modules/.bin/tsx", "/opt/geo-app/apps/worker/src/report-worker.ts"]

  web:
    image: geo-console-web:${GEO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    volumes:
      - ${GEO_DESKTOP_RELEASES_DIR:-./dist/desktop}:/srv/desktop:ro

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      GEO_DOMAIN: ${GEO_DOMAIN:?set GEO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  backup:
    image: postgres:18.6-alpine3.23
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGDATABASE: geo
      PGUSER: geo
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${GEO_BACKUP_DIR:-./server-backups}:/backups
      - evidence_data:/evidence:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "export PGPASSWORD=$$(cat /run/secrets/postgres_password); stamp=$$(date +%Y%m%d-%H%M%S); pg_dump -Fc -f /backups/geo-$$stamp.dump; tar -czf /backups/evidence-$$stamp.tgz -C /evidence ."
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  master_key:
    file: ./secrets/master_key
  admin_password:
    file: ./secrets/admin_password
  log_service_token:
    file: ./secrets/log_service_token

volumes:
  postgres_data:
  evidence_data:
  caddy_data:
  caddy_config:
