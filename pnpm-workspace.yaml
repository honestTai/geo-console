packages:
  - "apps/*"
  - "packages/core"
  - "packages/authorization"
  - "packages/evidence"
  - "packages/metrics"
  - "packages/logging"
  - "packages/search-providers"
  - "packages/agent-runtime"

allowBuilds:
  "@google/genai": false
  "@prisma/client": false
  better-sqlite3: false
  esbuild: true
  protobufjs: false

blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - vite
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
